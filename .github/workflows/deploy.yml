name: Deploy compiled Flutter demo
on:
  push:
    branches: [main]
    paths: [web.zip, .github/workflows/deploy.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack compiled website
        run: |
          echo '9613ebec230dbf6895ad35418d6b661921723752bc72bebe780dffba1f5f1b20  web.zip' | sha256sum -c -
          unzip -q web.zip -d _site
          echo '248774b902b64118d5b9c54ed7f56f3b5b3592da9f5dc7eb4e695d8763fad198  _site/main.dart.js' | sha256sum -c -
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
