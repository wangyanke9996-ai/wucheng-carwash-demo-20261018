name: Deploy compiled Flutter demo
on:
  push:
    branches: [main]
    paths: [web.zip]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack compiled website
        run: |
          echo '339fccb6d9145ce9b85bab97697ba147df541c00e516ee496e809b215207c91c  web.zip' | sha256sum -c -
          unzip -q web.zip -d _site
          echo '6b0099932ab2a07cd8e470638b4b45fec1ba282b37b0dde6ec077d489a08af71  _site/main.dart.js' | sha256sum -c -
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
