name: Deploy compiled Flutter demo
on:
  push:
    branches: [main]
    paths: [web.zip]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack compiled website
        run: |
          echo 'aa4a671d53bb7037b7383fc5314582f771d40cd5cb831e431ef201dd6e817279  web.zip' | sha256sum -c -
          unzip -q web.zip -d _site
          echo 'c6f1c9efffcd1921f8fb02692c97f7a6b60a7f485e851f54141d0e27338bdb06  _site/main.dart.js' | sha256sum -c -
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
